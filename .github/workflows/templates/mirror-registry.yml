# MoonBit Registry Mirror Template
#
# This workflow keeps a mirror of the mooncakes.io package index in a git
# repository on GitHub. Copy this file to the .github/workflows/ directory of
# the repository that runs the job.
#
# Features:
# - Daily automatic sync from upstream
# - Manual trigger support
# - Pushes the index to branch main of a separate index repository
# - Keeps the git history of the package index
#
# Why a git repository and not GitHub Pages:
# Current moon clones the index with "git clone --depth 1 --single-branch"
# and updates it with "git fetch --depth=1 origin +refs/heads/main:...".
# Shallow fetches need the Git Smart HTTP protocol and a branch named main.
# A GitHub repository URL has both. GitHub Pages and other static hosts use
# the dumb HTTP protocol, which cannot do shallow fetches. moon then fails
# with "dumb http transport does not support shallow capabilities".
#
# Setup:
# 1. Create the index repository, for example my-org/mooncakes-index.
#    Initialize it with a README, so that branch main exists.
# 2. If the repository is in an organization, let members use deploy keys:
#    Organization Settings > Member privileges > Deploy keys.
# 3. Make an SSH key pair:
#      ssh-keygen -t ed25519 -N "" -C "mirror" -f mirror-key
# 4. In the index repository, add mirror-key.pub as a deploy key:
#    Settings > Deploy keys > Add deploy key. Select "Allow write access".
# 5. In the repository that runs this workflow, add the private key
#    (the content of mirror-key) as the secret INDEX_DEPLOY_KEY:
#    Settings > Secrets and variables > Actions > New repository secret.
#    Then delete the local key files.
# 6. Set INDEX_REPOSITORY and PACKAGES_TO_MIRROR below.
#
# Client setup:
# This mirror holds only the index. The package archives (.zip) stay on the
# upstream download host. On each client, write $MOON_HOME/config.json
# (default ~/.moon/config.json):
#
#   {
#     "api": "https://mooncakes.io",
#     "index": "https://github.com/my-org/mooncakes-index.git",
#     "download": "https://download.mooncakes.io"
#   }
#
# Then run "moon update". When config.json exists, moon ignores
# MOONCAKES_REGISTRY. To serve the archives from your own host as well, run
# "moonbit-registry serve" on that host (see the README).

name: Mirror Registry

on:
  schedule:
    # Sync daily at 2 AM UTC
    - cron: '0 2 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Mirror entire registry (not just specified packages)'
        type: boolean
        default: false
      packages:
        description: 'Additional package patterns to mirror (space-separated)'
        type: string
        required: false

# Only allow one sync at a time
concurrency:
  group: mirror-sync
  cancel-in-progress: false

env:
  # Index repository (owner/name). The job pushes to its main branch.
  INDEX_REPOSITORY: my-org/mooncakes-index

  # Space-separated list of package patterns
  # Examples: "moonbitlang/*" "company/specific-pkg" "author/lib-*"
  PACKAGES_TO_MIRROR: "moonbitlang/*"

  # Registry directory name
  REGISTRY_DIR: ".registry"

# The job pushes with the deploy key, so it does not write to this repository
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # The index repository becomes the registry's data/index directory.
      # "init" keeps an existing git repository there.
      - name: Checkout index repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INDEX_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
          path: ${{ env.REGISTRY_DIR }}/data/index

      - name: Configure git
        run: |
          cd "${{ env.REGISTRY_DIR }}/data/index"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize registry
        uses: moonrockz/moonbit-registry-tools@main
        with:
          command: init
          registry-dir: ${{ env.REGISTRY_DIR }}
          registry-name: my-mirror

      - name: Add mooncakes source
        uses: moonrockz/moonbit-registry-tools@main
        with:
          command: source-add
          registry-dir: ${{ env.REGISTRY_DIR }}
          source-name: mooncakes
          source-preset: mooncakes

      # mirror downloads and verifies each archive, writes the index files
      # to data/index/user/<owner>/<pkg>.index and commits them
      - name: Mirror packages
        uses: moonrockz/moonbit-registry-tools@main
        with:
          command: mirror
          registry-dir: ${{ env.REGISTRY_DIR }}
          patterns: ${{ env.PACKAGES_TO_MIRROR }} ${{ github.event.inputs.packages }}
          full: ${{ github.event.inputs.full_sync || 'false' }}
          verbose: true

      - name: Push index
        run: |
          cd "${{ env.REGISTRY_DIR }}/data/index"
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "No index changes to push"
          else
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          cd "${{ env.REGISTRY_DIR }}/data/index"
          TOTAL_PACKAGES=$(find user -name "*.index" -type f 2>/dev/null | wc -l)
          TOTAL_OWNERS=$(find user -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          {
            echo "## Mirror Summary"
            echo ""
            echo "- **Packages**: $TOTAL_PACKAGES"
            echo "- **Publishers**: $TOTAL_OWNERS"
            echo "- **Index**: https://github.com/${{ env.INDEX_REPOSITORY }}.git (branch main)"
          } >> "$GITHUB_STEP_SUMMARY"
